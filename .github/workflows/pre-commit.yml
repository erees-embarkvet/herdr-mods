name: Pre-commit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes (zizmor: artipacked).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # The mod-syntax hook runs `node --check`, which needs Node 22+ to detect ES modules.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit==4.6.1

      - name: Commit-stage hooks
        env:
          # A push to main checks out main, which this hook exists to refuse.
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure --color always

      - name: CI-only hooks (full-tree gitleaks and large files, zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pre-commit run --all-files --hook-stage manual --show-diff-on-failure --color always
